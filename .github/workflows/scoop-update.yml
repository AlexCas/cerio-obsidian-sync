name: Update Scoop Manifest

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-scoop-manifest:
    name: Update Scoop Manifest
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get release version from tag
        id: version
        run: |
          # Get the tag from the workflow_run event
          TAG="${{ github.event.workflow_run.head_branch }}"
          # Remove 'v' prefix if present
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (from tag $TAG)"

      - name: Create assets directory
        run: mkdir -p ./assets

      - name: Download Windows x86_64 asset
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          FILENAME="osync_${{ steps.version.outputs.version }}_windows_x86_64.zip"
          curl -L -o "./assets/$FILENAME" \
            "https://github.com/AlexCas/cerio-obsidian-sync/releases/download/$TAG/$FILENAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows arm64 asset
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          FILENAME="osync_${{ steps.version.outputs.version }}_windows_aarch64.zip"
          curl -L -o "./assets/$FILENAME" \
            "https://github.com/AlexCas/cerio-obsidian-sync/releases/download/$TAG/$FILENAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          X86_CHECKSUM=$(sha256sum ./assets/osync_${{ steps.version.outputs.version }}_windows_x86_64.zip | awk '{print $1}')
          ARM_CHECKSUM=$(sha256sum ./assets/osync_${{ steps.version.outputs.version }}_windows_aarch64.zip | awk '{print $1}')
          echo "x86_64_checksum=$X86_CHECKSUM" >> $GITHUB_OUTPUT
          echo "aarch64_checksum=$ARM_CHECKSUM" >> $GITHUB_OUTPUT
          echo "x86_64: $X86_CHECKSUM"
          echo "aarch64: $ARM_CHECKSUM"

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: AlexCas/scoop-cerio-obsync
          token: ${{ secrets.SCOOOP_BUCKET_TOKEN }}
          path: ./bucket

      - name: Update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          X86_CHECKSUM="${{ steps.checksums.outputs.x86_64_checksum }}"
          ARM_CHECKSUM="${{ steps.checksums.outputs.aarch64_checksum }}"
          
          # Read current manifest from bucket
          MANIFEST=$(cat ./bucket/osync.json)
          
          # Update version
          MANIFEST=$(echo "$MANIFEST" | jq --arg v "$VERSION" '.version = $v')
          
          # Update URLs for 64bit
          MANIFEST=$(echo "$MANIFEST" | jq --arg v "$VERSION" \
            '.architecture."64bit".url = ("https://github.com/AlexCas/cerio-obsidian-sync/releases/download/v" + $v + "/osync_" + $v + "_windows_x86_64.zip")')
          
          # Update URLs for arm64
          MANIFEST=$(echo "$MANIFEST" | jq --arg v "$VERSION" \
            '.architecture."arm64".url = ("https://github.com/AlexCas/cerio-obsidian-sync/releases/download/v" + $v + "/osync_" + $v + "_windows_aarch64.zip")')
          
          # Add checksums
          MANIFEST=$(echo "$MANIFEST" | jq --arg x86 "$X86_CHECKSUM" --arg arm "$ARM_CHECKSUM" \
            '.architecture."64bit".hash = $x86 | .architecture."arm64".hash = $arm')
          
          # Write updated manifest
          echo "$MANIFEST" | jq '.' > ./bucket/osync.json
          
          echo "Updated manifest to version $VERSION"
          cat ./bucket/osync.json

      - name: Commit and push updated manifest
        run: |
          cd ./bucket
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add osync.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update manifest to v${{ steps.version.outputs.version }}"
            git push
          fi
